function renderSessionNode(session,visibleIds,depth=0,trail=new Set()){if(trail.has(session.id))return'';const nextTrail=new Set(trail);nextTrail.add(session.id);const children=state.sessions.filter(s=>s.parentId===session.id&&visibleIds.has(s.id)).sort((a,b)=>sessionTake(a)-sessionTake(b)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));const isRepeat=!!session.parentId;const chainCount=chainSessions(session).length;const repeatBadge=(isRepeat||chainCount>1)?`<span class="repeat-badge">${isRepeat?'↳ ':''}第 ${sessionTake(session)} 次${children.length?` · ${children.length} 个子练习`:''}</span>`:'';return `<div class="repeat-node ${isRepeat?'is-repeat':''}" style="--depth:${Math.min(depth,20)}"><div class="session-card"><div style="min-width:0"><div class="session-title">${esc(session.title||PURPOSES[session.purpose]||'练习')}</div><div class="session-tags">${repeatBadge}<span class="purpose-badge">${PURPOSE_ICONS[session.purpose]||'•'} ${esc(PURPOSES[session.purpose]||'其他')}</span><span>${fmtDate(session.date)}</span><span class="dot"></span><span>${session.audio?`🎧 ${fmtTime(session.duration)}`:'✎ 文字记录'}</span><span>${session.archivePath?'💾 文件已归档':session.archiveStatus==='error'?'⚠ 仅浏览器':'◌ 待归档'}</span>${(session.errorTags||[]).slice(0,2).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${session.takeaway?`<div class="micro" style="margin-top:7px;max-width:680px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">收获：${esc(session.takeaway)}</div>`:''}</div><div class="session-card-actions"><button class="btn tiny" data-repeat="${eAttr(session.id)}">↻ 再练一次</button><button class="btn" data-edit="${eAttr(session.id)}">查看 / 复盘 →</button></div></div>${children.map(child=>renderSessionNode(child,visibleIds,depth+1,nextTrail)).join('')}</div>`}
function renderSessionsTree(){const q=filter.q.toLowerCase();let data=state.sessions.filter(s=>(filter.purpose==='all'||s.purpose===filter.purpose)&&[s.title,s.prompt,s.raw,s.polished,s.notes,s.takeaway].join(' ').toLowerCase().includes(q)&&(filter.repeat==='all'||filter.repeat==='roots'&&!s.parentId||filter.repeat==='repeats'&&!!s.parentId));data.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));const visibleIds=new Set(data.map(s=>s.id));const roots=data.filter(s=>!s.parentId||!visibleIds.has(s.parentId));const groups={};for(const s of roots){const label=filter.group==='purpose'?(PURPOSES[s.purpose]||'其他练习'):s.date;if(!groups[label])groups[label]=[];groups[label].push(s)}const groupsHtml=Object.entries(groups).map(([key,items])=>`<div class="group-label">${filter.group==='purpose'?esc(key):fmtDate(key)} · ${items.length} 条练习链</div><div class="rows">${items.map(s=>renderSessionNode(s,visibleIds)).join('')}</div>`).join('');const dailyEntries=Object.entries(state.days).filter(([,d])=>Object.values(d.done||{}).some(Boolean)||d.grammarNotes||d.compression100||d.compression50||d.compression25||Object.values(d.reflection||{}).some(Boolean)).sort((a,b)=>b[0].localeCompare(a[0]));const journalHtml=`<section class="panel" style="margin-top:20px">${panelTitle('每日训练日记 · 历史归档','语法纠错、100 / 50 / 25 词写作以及日终复盘，按日期归档',`${dailyEntries.length} 天`)}${dailyEntries.length?`<div class="rows">${dailyEntries.slice(0,120).map(([date,d])=>`<div class="session-card"><div><div class="session-title">${fmtDate(date)}</div><div class="session-tags"><span class="purpose-badge">完成 ${TASKS.filter(t=>d.done?.[t[0]]).length}/5 项</span>${d.grammarNotes?'<span>✎ 语法</span>':''}${d.compression25?'<span>◈ 压缩写作</span>':''}${d.reflection?.next?'<span>☼ 反思</span>':''}</div></div><button class="btn" data-day-edit="${date}">查看 / 修改 →</button></div>`).join('')}</div>`:'<div class="empty">今日写作和复盘会自动归档在这里，明天仍然能查看和修改。</div>'}</section>`;return `${header('练习档案','每条练习都可以无限“再练一次”；子记录拥有独立音频、Before / After 与复盘。','RECORDINGS & REPEAT TREES',`<button class="btn primary" id="add-session-btn">+ 新增文字练习</button>`)}<section class="panel"><div class="intro-card" style="margin-bottom:14px">${archive.available?`✓ 文件档案已连接：<code>${esc(archive.root)}</code>`:`⚠ 文件档案未连接；请用 <code>start.command</code> 启动。当前修改只能保存在浏览器。`}</div><div class="filters"><input id="search-sessions" type="search" placeholder="搜索标题、转写内容、反思…" value="${eAttr(filter.q)}"><select id="filter-purpose"><option value="all">全部训练目的</option>${options(PURPOSES,filter.purpose)}</select><select id="repeat-filter"><option value="all" ${filter.repeat==='all'?'selected':''}>全部练习层级</option><option value="roots" ${filter.repeat==='roots'?'selected':''}>只看第 1 次</option><option value="repeats" ${filter.repeat==='repeats'?'selected':''}>只看重复练习</option></select><select id="group-by"><option value="date" ${filter.group==='date'?'selected':''}>按日期分组</option><option value="purpose" ${filter.group==='purpose'?'selected':''}>按训练目的分组</option></select><button class="btn" id="import-sessions-audio">导入音频 / 视频</button><input type="file" accept="audio/*,video/*,.m4a,.wav,.mp3,.webm,.mp4,.mov" id="audio-import-session" hidden></div>${data.length?groupsHtml:`<div class="empty"><div class="emoji">↻</div>还没有符合条件的练习记录。<br>打开任意练习，点击“再练一次”开始建立重复练习树。</div>`}</section>${journalHtml}`}

function renderReview(){const due=dueCards();const card=due[0];const counts={};state.sessions.forEach(s=>(s.errorTags||[]).forEach(e=>counts[e]=(counts[e]||0)+1));const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return `${header('把错误变成反射。','从自己的真实表达里提取高频 Chunks，通过间隔复习让它们成为可以脱口而出的语言。','SPACED REPETITION',`<button class="btn primary" id="new-card-btn">+ 新建表达卡</button>`)}<div class="grid2 equal"><div class="stack"><section class="panel">${panelTitle('今天的复习',`${due.length} 张到期 · 间隔 1 / 3 / 7 / 14 天`,`${state.cards.length} 张总计`)}${card?`<div class="flashcard"><span class="small-heading">先看中文，用 3 秒说出英文</span><div class="cn">${esc(card.cn)}</div>${reviewRevealed?`<div class="en">${esc(card.en)}</div><div class="context">${esc(card.context||'')}</div>`:'<div style="font-size:12px;color:#9daa9d">说出来以后再翻卡</div>'}</div><div style="display:flex;gap:8px;margin-top:14px">${reviewRevealed?`<button class="btn" style="flex:1" data-grade="again">还不熟 · 明天再练</button><button class="btn primary" style="flex:1" data-grade="good">掌握了 · 延长间隔</button>`:`<button class="btn primary wide" id="reveal-card">显示英文表达 →</button>`}</div>`:`<div class="empty"><div class="emoji">✓</div>今天没有待复习卡片。<br>把最近说得不自然的句子做成一张新卡吧。</div>`}</section><section class="panel">${panelTitle('建立新的表达卡','不要背孤立单词；整句提取，加入你的真实使用场景')}<div class="field"><label>中文触发句（正面）</label><textarea id="card-cn" placeholder="真正的问题不是模型能力，而是如何集成到现有工作流中。"></textarea></div><div class="field" style="margin-top:12px"><label>地道英文（背面）</label><textarea id="card-en" placeholder="The real challenge isn't model capability. It's integrating the technology into existing workflows."></textarea></div><div class="field" style="margin-top:12px"><label>上下文 / 记忆提示（可选）</label><input id="card-context" placeholder="Apple vendor evaluation / API vs production"></div><button class="btn primary" id="save-card" style="margin-top:15px">+ 加入间隔复习</button></section></div><div class="stack"><section class="panel">${panelTitle('高频错误观察','基于练习档案里你自己标记的错误类别')}${sorted. function renderInsights(){const days=[];for(let i=20;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=iso(d);const day=state.days[key];const n=day?TASKS.filter(t=>day.done[t[0]]).length:0;days.push({key,seconds:getDaySeconds(key),done:n})}const total=state.sessions.reduce((a,s)=>a+(s.duration||0),0);const daysActive=new Set([...Object.entries(state.days).filter(([,d])=>Object.values(d.done||{}).some(Boolean)).map(([k])=>k),...state.sessions.map(s=>s.date)]).size;const scoreItems=DIMENSIONS.map(([k,label])=>{const scores=state.sessions.map(s=>s.scores&&s.scores[k]).filter(x=>x&&Number(x)>0);const avg=scores.length?(scores.reduce((a,b)=>a+Number(b),0)/scores.length).toFixed(1):'—';return `<div class="score-row"><span>${label}</span><strong>${avg}${avg==='—'?'':' / 5'}</strong></div>`}).join('');return `${header('看见每天的积累。','这里仅统计你真实保存的练习、时长、错题标记和手动评分；不会伪装成 AI 自动打分。','PRACTICE ANALYTICS')}<div class="stats"><div class="stat"><div class="k">累计录音时长</div><div class="n">${Math.round(total/60)}<i> min</i></div><div class="sub">含导入的有时长音频</div></div><div class="stat"><div class="k">有效训练日</div><div class="n">${daysActive}<i> 天</i></div><div class="sub">完成任务或创建记录</div></div><div class="stat"><div class="k">练习档案</div><div class="n">${state.sessions.length}</div><div class="sub">音频 + 文字记录</div></div><div class="stat"><div class="k">掌握的表达卡</div><div class="n">${state.cards.filter(c=>c.level>0).length}</div><div class="sub">至少成功复习一次</div></div></div><div class="grid2 equal"><section class="panel">${panelTitle('最近 21 天录音时长','纵轴为当天录音分钟数，深绿色是今天')}<div class="barbox">${days.map((d,i)=>`<div class="bar-item ${i===20?'current':''}"><div class="bar" title="${d.key}: ${Math.round(d.seconds/60)} 分钟" style="height:${Math.max(3,Math.min(145,d.seconds/60/Math.max(1,...days.map(x=>x.seconds/60))*138))}px"></div><div class="bar-label">${i%3===0||i===20?d.key.slice(5):'·'}</div></div>`).join('')}</div><div class="micro" style="margin-top:15px">目标：每天 ${state.settings.dailyGoal} 分钟。录音 async function durationOf(file){return new Promise(res=>{const url=URL.createObjectURL(file);const a=new Audio();const clean=(v)=>{URL.revokeObjectURL(url);res(Number.isFinite(v)?Math.round(v):0)};a.addEventListener('loadedmetadata',()=>clean(a.duration),{once:true});a.addEventListener('error',()=>clean(0),{once:true});a.src=url;setTimeout(()=>clean(0),3500)})}
async function importAudio(input){const file=input.files?.[0];if(!file)return;const draft=view==='today'?(state.settings.recordDraft||{}):{},isRepeat=!!draft.repeatParentId;const purposeMatch=file.name.match(/_(speaking|grammar|chunks|compression|interview|reflection|other)(?:\.|_)/i);const purpose=purposeMatch?purposeMatch[1].toLowerCase():getField('record-purpose')||draft.purpose||'speaking';const title=getField('record-title').trim()||draft.title||file.name.replace(/\.[^.]+$/,'');const prompt=getField('record-prompt')||draft.prompt||'';const dateMatch=file.name.match(/(\d{4}-\d{2}-\d{2})/);const date=dateMatch?dateMatch[1]:TODAY();const id=uid();const duration=await durationOf(file);const s={id,createdAt:now().toISOString(),date,title,purpose,prompt,duration,audio:true,source:'import',mime:file.type,filename:file.name,originalFilename:file.name,parentId:isRepeat?draft.repeatParentId:null,rootId:isRepeat?draft.repeatRootId:id,takeNumber:isRepeat?Number(draft.repeatTakeNumber)||2:1,repeatDepth:isRepeat?Number(draft.repeatDepth)||1:0,raw:'',polished:'',notes:'',takeaway:'',nextAction:'',errorTags:[],scores:{}};try{await audioPut(id,file);state.sessions.unshift(s);state.settings.recordDraft={title:'',purpose:'speaking',prompt:s.prompt};await save();try{await persistSession(s,file,file.name)}catch(error){notify('媒体已留在浏览器，但写入 recordings 失败：'+error.message)}input.value='';navigate('sessions');startEdit(id);if(s.archivePath)notify(isRepeat?`第 ${s.takeNumber} 次重复练习已导入并归档`:`已导入并归档：${file.name}`)}catch(e){notify('音频 / 视频导入失败，请检查文件及本地空间')}}
function addCardFromDialog(){const s=state.sessions.find(x=>x.id===editingId);if(!s)return;const takeaway=getField('edit-takeaway')||s.takeaway;const cn=prompt('给这句英文写一个中文触发句（正面）：');if(!cn)return;const en=prompt('英文完整表达（背面）：',takeaway||'');if(!en)return;state.cards.unshift({id:uid(),cn:cn.trim(),en:en.trim(),context:s.title,createdAt:now().toISOString(),nextDue:TODAY(),level:0,reviewCount:0});save().then(()=>notify('已添加复习卡，可在错题复盘中找到'))}
async function saveCard(){const cn=getField('card-cn').trim(),en=getField('card-en').trim();if(!cn||!en){notify('请填写中文触发句和英文表达');return}state.cards.unshift({id:uid(),cn,en,context:getField('card-context').trim(),createdAt:now().toISOString(),nextDue:TODAY(),level:0,reviewCount:0});await save();reviewRevealed=false;render();notify('新卡片已加入今日复习')}
async function gradeCard(g){const card=dueCards()[0];if(!card)return;const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);if(g==='again'){card.level=0;card.nextDue=iso(tomorrow)}else{card.level=Math.min(4,(card.level||0)+1);let next=new Date();next.setDate(next.getDate()+[0,1,3,7,14][card.level]);card.nextDue=iso(next)}card.reviewCount=(card.reviewCount||0)+1;card.lastReviewed=TODAY();await save();reviewRevealed=false;render();notify(g==='good'?'复习成功 · 已延长间隔':'已安排明天再练')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function download(data,name,mime='application/octet-stream'){const blob=data instanceof Blob?data:new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),18000)}
function blobDataUrl(blob){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>rej(reader.error);reader.readAsDataURL(blob)})}
async function exportData(includeAudio){const obj=JSON.parse(JSON.stringify(state));obj.exportedAt=now().toISOString();obj.audioIncluded=includeAudio;if(includeAudio){obj.recordings={};let count=0;for(const s of state.sessions.filter(s=>s.audio)){let blob=await archiveBlobFor(s);if(!blob&&s.archivePath&&archive.available){try{const response=await fetch(audioApiUrl(s.id));if(response.ok)blob=await response.blob()}catch(e){}}if(blob){obj.recordings[s.id]=await blobDataUrl(blob);count++}}notify(`备份已整理 ${count} 段录音，准备下载…`)}download(JSON.stringify(obj,null,2),`fluent-lab-${TODAY()}${includeAudio?'-full':'-text'}.json`,'application/json');notify('备份文件已生成，请妥善保存')}
function exportCSV(){const cols=['date','title','purpose','take_number','repeat_depth','parent_id','root_id','duration_seconds','source','error_tags','raw_transcript','polished_transcript','notes','takeaway','next_action',...DIMENSIONS.map(x=>x[0])];const lines=[cols.map(csvCell).join(',')];state.sessions.forEach(s=>lines.push([s.date,s.title,PURPOSES[s.purpose],sessionTake(s),sessionDepth(s),s.parentId||'',sessionRootId(s),s.duration,s.source,(s.errorTags||[]).join('; '),s.raw,s.polished,s.notes,s.takeaway,s.nextAction,...DIMENSIONS.map(x=>s.scores?.[x[0]]||'')].map(csvCell).join(',')));download('\ufeff'+lines.join('\r\n'),`fluent-lab-sessions-${TODAY()}.csv`,'text/csv;charset=utf-8');notify('CSV 已导出（包含重复练习父子关系）')}
async function restoreBackup(file){if(!file)return;if(!confirm('恢复备份将替换当前浏览器缓存，并把记录同步进 recordings。确定继续吗？'))return;try{const raw=JSON.parse(await file.text());if(!Array.isArray(raw.sessions)||!Array.isArray(raw.cards)||!raw.days||!raw.settings)throw Error('备份结构无效');const blobs={};for(const [id,data] of Object.entries(raw.recordings||{})){if(!/^data:(audio|video)\//.test(data))continue;const result=await fetch(data);blobs[id]=await result.blob()}delete raw.recordings;delete raw.exportedAt;delete raw.audioIncluded;for(const s of raw.sessions){delete s.archivePath;delete s.archiveStatus;if(s.audio&&!blobs[s.id]){s.audio=false;s.audioMissing=true}}await new Promise((res,rej)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').clear();for(const [id,blob] of Object.entries(blobs))tx.objectStore('audio').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});state=raw;await save();render();await migrateBrowserSessions();notify(`成功恢复 ${state.sessions.length} 条记录及 ${Object.keys(blobs).length} 段录音`)}catch(e){notify('恢复失败：'+e.message)}}
function handleClicks(e){const b=e.target.closest('button,[data-goto]');if(!b)return;if(b.dataset.view)return navigate(b.dataset.view);if(b.dataset.goto)return navigate(b.dataset.goto);if(b.dataset.task){const d=ensureDay();const key=b.dataset.task;d.done[key]=!d.done[key];save().then(render);return}if(b.dataset.prompt!==undefined){const p=PROMPTS[Number(b.dataset.prompt)];const el=$('record-prompt');if(el){el.value=p[1];el.focus();syncDraft();notify(`已设置话题：${p[0]}`)}return}if(b.dataset.repeat)return prepareRepeat(b.dataset.repeat);if(b.id==='dlg-repeat')return prepareRepeat(editingId);if(b.id==='cancel-repeat')return cancelRepeatDraft();if(b.dataset.edit)return startEdit(b.dataset.edit);if(b.dataset.dayEdit)return openDay(b.dataset.dayEdit);if(b.dataset.error){b.classList.toggle('selected');return}if(b.dataset.grade)return gradeCard(b.dataset.grade);if(b.dataset.deleteCard){if(!confirm('删除这张表达卡？'))return;state.cards=state.cards.filter(c=>c.id!==b.dataset.deleteCard);save().then(render);return}
const handlers={'record-toggle':toggleRecord,'save-recording':saveRecording,'new-text-session':newSession,'add-session-btn':newSession,'import-sessions-audio':()=>$('audio-import-session')?.click(),'dlg-close':closeDialog,'day-close':closeDay,'day-save':saveDay,'dlg-save':saveEdit,'dlg-delete':deleteSession,'dlg-add-card':addCardFromDialog,'download-session-audio':async()=>{const s=state.sessions.find(x=>x.id===editingId);if(!s)return;const blob=await archiveBlobFor(s);if(blob){const ext=(blob.type||'').includes('mp4')?'m4a':(blob.type||'').includes('ogg')?'ogg':(blob.type||'').includes('wav')?'wav':'webm';download(blob,`${s.date}_${s.purpose}_${s.id.slice(-5)}.${ext}`);return}if(s.archivePath&&archive.available){const a=document.createElement('a');a.href=audioApiUrl(s.id);a.download=s.originalFilename||s.mediaFile||`${s.id}.audio`;document.body.append(a);a.click();a.remove();return}notify('未找到本地音频')},'save-card':saveCard,'new-card-btn':()=>{$('card-cn')?.focus()},'reveal-card':()=>{reviewRevealed=true;render()},'save-settings':async()=>{state.settings.dailyGoal=Math.max(5,Math.min(180,parseInt(getField('setting-goal'))||30));state.settings.focus=getField('setting-focus');state.settings.focusDescription=getField('setting-focusdesc');await save();render();notify('训练设置已保存')},'export-full':()=>exportData(true).catch(e=>notify('导出失败：'+e.message)),'export-small':()=>exportData(false).catch(e=>notify('导出失败')),'export-csv':exportCSV,'erase-all':async()=>{if(!confirm('这只会清空当前浏览器缓存，不会删除 recordings 文件夹。确定吗？'))return;await new Promise((res,rej)=>{const tx=db.transaction(['audio','kv'],'readwrite');tx.objectStore('audio').clear();tx.objectStore('kv').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});state=defaultState();await connectArchive();ensureDay();await save();navigate('today');notify('浏览器缓存已重建；recordings 文件档案仍然保留')}};if(handlers[b.id])handlers[b.id]()}
let saveQueued=null;function queueSave(){clearTimeout(saveQueued);saveQueued=setTimeout(()=>save().catch(e=>notify('自动保存失败：'+e.message)),450)}
function handleInput(e){const t=e.target;if(t.dataset.dayField){ensureDay()[t.dataset.dayField]=t.value;queueSave()}if(t.dataset.reflection){ensureDay().reflection[t.dataset.reflection]=t.value;queueSave()}if(['record-title','record-purpose','record-prompt'].includes(t.id))syncDraft();if(['filter-purpose','repeat-filter','group-by','search-sessions'].includes(t.id)){if(t.id==='filter-purpose')filter.purpose=t.value;if(t.id==='repeat-filter')filter.repeat=t.value;if(t.id==='group-by')filter.group=t.value;if(t.id==='search-sessions')filter.q=t.value;const cursor=t.selectionStart;render();if(t.id==='search-sessions'){const s=$('search-sessions');s.focus();s.setSelectionRange(cursor,cursor)}}}
function handleChange(e){if(['audio-import','audio-import-session'].includes(e.target.id))importAudio(e.target);if(e.target.id==='import-backup'){restoreBackup(e.target.files?.[0]);e.target.value=''}}
function handleKey(e){if(e.altKey&&e.shiftKey&&e.code==='KeyR'){e.preventDefault();if(view!=='today')navigate('today');toggleRecord()}}
async function boot(){try{db=await openDB();state=await dbGet('kv','state')||defaultState();if(!state.settings)state.settings=defaultState().settings;if(!state.days)state.days={};if(!state.cards)state.cards=[];if(!state.sessions)state.sessions=[];await connectArchive();ensureDay();await save();document.addEventListener('click',handleClicks);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('keydown',handleKey);$('day-dialog').addEventListener('close',()=>{editingDay=null});$('session-dialog').addEventListener('close',()=>{if(activeAudioUrl){URL.revokeObjectURL(activeAudioUrl);activeAudioUrl=null}editingId=null});render();migrateBrowserSessions()}catch(err){$('main').innerHTML=`<section class="panel"><h2>浏览器存储不可用</h2><p>请在常规 Chrome / Safari 窗口中，通过 <code>start.command</code> 打开本项目，并检查是否禁用了 IndexedDB。</p><pre>${esc(err.message)}</pre></section>`}}
boot();
</script>
